[project]
name = "ig-postprocess"
version = "0.1.0"
description = "Organize an Instagram data export into per-post media folders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ig-postprocess = "ig_postprocess.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_postprocess"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
